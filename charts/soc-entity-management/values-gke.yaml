global:
  imageRegistry: example.invalid/soc-entity-management
  imageTag: latest
  imagePullPolicy: IfNotPresent

backend:
  service:
    type: NodePort

frontend:
  service:
    type: NodePort

ingress:
  enabled: true
  className: gce
  staticIpName: soc-entity-management-http-ip

postgresql:
  storage:
    size: 20Gi

kafka:
  storage:
    size: 20Gi

neo4j:
  storage:
    size: 20Gi

enrichment:
  providerMode: ipinfo_malwarebazaar
