{{- if .Values.secrets.create }}
{{- $secretName := include "soc.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
{{- $existingData = $existingSecret.data -}}
{{- end -}}
{{- $postgresPassword := .Values.secrets.postgresPassword | toString -}}
{{- $databaseUrl := "" -}}
{{- if ne $postgresPassword "" -}}
{{- $databaseUrl = printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $postgresPassword (include "soc.postgresqlHeadlessName" .) .Values.postgresql.auth.database -}}
{{- end -}}
{{- $neo4jPassword := .Values.secrets.neo4jPassword | toString -}}
{{- $neo4jAuth := "" -}}
{{- if ne $neo4jPassword "" -}}
{{- $neo4jAuth = printf "%s/%s" .Values.neo4j.auth.username $neo4jPassword -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ include "soc.secretDataValue" (dict "key" "JWT_SECRET_KEY" "value" .Values.secrets.jwtSecretKey "existingData" $existingData) }}
  POSTGRES_PASSWORD: {{ include "soc.secretDataValue" (dict "key" "POSTGRES_PASSWORD" "value" $postgresPassword "existingData" $existingData) }}
  DATABASE_URL: {{ include "soc.secretDataValue" (dict "key" "DATABASE_URL" "value" $databaseUrl "existingData" $existingData) }}
  NEO4J_PASSWORD: {{ include "soc.secretDataValue" (dict "key" "NEO4J_PASSWORD" "value" $neo4jPassword "existingData" $existingData) }}
  NEO4J_AUTH: {{ include "soc.secretDataValue" (dict "key" "NEO4J_AUTH" "value" $neo4jAuth "existingData" $existingData) }}
  ENRICHMENT_IPINFO_TOKEN: {{ include "soc.secretDataValue" (dict "key" "ENRICHMENT_IPINFO_TOKEN" "value" .Values.secrets.enrichmentIpinfoToken "existingData" $existingData) }}
  ENRICHMENT_MALWARE_BAZAAR_AUTH_KEY: {{ include "soc.secretDataValue" (dict "key" "ENRICHMENT_MALWARE_BAZAAR_AUTH_KEY" "value" .Values.secrets.enrichmentMalwareBazaarAuthKey "existingData" $existingData) }}
  GRAFANA_ADMIN_PASSWORD: {{ include "soc.secretDataValue" (dict "key" "GRAFANA_ADMIN_PASSWORD" "value" .Values.monitoring.grafana.adminPassword "existingData" $existingData) }}
{{- end }}
