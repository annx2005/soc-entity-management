{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soc.secretName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | toString | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | toString | b64enc | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | toString | b64enc | quote }}
  ENRICHMENT_IPINFO_TOKEN: {{ .Values.secrets.enrichmentIpinfoToken | toString | b64enc | quote }}
  ENRICHMENT_MALWARE_BAZAAR_AUTH_KEY: {{ .Values.secrets.enrichmentMalwareBazaarAuthKey | toString | b64enc | quote }}
{{- end }}
