{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soc.prometheusName" . }}-config
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: soc-backend
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ include "soc.backendName" . }}:8000

      - job_name: soc-kafka-ingestion-worker
        static_configs:
          - targets:
              - {{ include "soc.ingestionWorkerName" . }}:{{ .Values.monitoring.workerMetricsPort }}

      - job_name: soc-kafka-graph-worker
        static_configs:
          - targets:
              - {{ include "soc.graphWorkerName" . }}:{{ .Values.monitoring.workerMetricsPort }}

      - job_name: kafka-exporter
        static_configs:
          - targets:
              - {{ include "soc.kafkaExporterName" . }}:{{ .Values.monitoring.kafkaExporter.port }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soc.prometheusName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.monitoring.prometheus.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soc.prometheusName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "soc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /prometheus && chown -R 65534:65534 /prometheus"]
          volumeMounts:
            - name: data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image | quote }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.prometheus.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "soc.prometheusName" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "soc.prometheusName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soc.prometheusName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.monitoring.prometheus.port }}
      targetPort: http
  selector:
    {{- include "soc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soc.kafkaExporterName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka-exporter
  template:
    metadata:
      labels:
        {{- include "soc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: {{ .Values.monitoring.kafkaExporter.image | quote }}
          args:
            - --kafka.server={{ include "soc.kafkaHeadlessName" . }}:9092
            - --web.listen-address=:{{ .Values.monitoring.kafkaExporter.port }}
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.kafkaExporter.port }}
          resources:
            {{- toYaml .Values.monitoring.kafkaExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soc.kafkaExporterName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.monitoring.kafkaExporter.port }}
      targetPort: http
  selector:
    {{- include "soc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-exporter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soc.grafanaName" . }}-datasources
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "soc.prometheusName" . }}:{{ .Values.monitoring.prometheus.port }}
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soc.grafanaName" . }}-dashboard-provider
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: SOC Entity Management
        orgId: 1
        folder: SOC
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soc.grafanaName" . }}-dashboard
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  soc-entity-management.json: |
    {
      "editable": true,
      "panels": [
        {"id":1,"type":"timeseries","title":"Entity Count by Tenant and Type","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"sum by (tenant_id, entity_type) (soc_entities_total)","legendFormat":"{{ "{{tenant_id}}" }} / {{ "{{entity_type}}" }}","refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":2,"type":"timeseries","title":"Entity Upsert Rate","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"sum by (tenant_id, entity_type, status) (rate(soc_graph_entities_upserted_total[5m]))","legendFormat":"{{ "{{tenant_id}}" }} / {{ "{{entity_type}}" }} / {{ "{{status}}" }}","refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":3,"type":"timeseries","title":"Enrichment Latency","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"histogram_quantile(0.50, sum by (le, entity_type) (rate(soc_enrichment_lookup_duration_seconds_bucket[5m])))","legendFormat":"p50 {{ "{{entity_type}}" }}","refId":"A"},{"expr":"histogram_quantile(0.95, sum by (le, entity_type) (rate(soc_enrichment_lookup_duration_seconds_bucket[5m])))","legendFormat":"p95 {{ "{{entity_type}}" }}","refId":"B"}],"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":4,"type":"timeseries","title":"Enrichment Outcomes","gridPos":{"h":8,"w":12,"x":12,"y":8},"targets":[{"expr":"sum by (entity_type, cache_status, outcome) (rate(soc_enrichment_requests_total[5m]))","legendFormat":"{{ "{{entity_type}}" }} / {{ "{{cache_status}}" }} / {{ "{{outcome}}" }}","refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":5,"type":"timeseries","title":"Kafka Queue Depth","gridPos":{"h":8,"w":12,"x":0,"y":16},"targets":[{"expr":"sum by (consumergroup, topic) (kafka_consumergroup_lag)","legendFormat":"{{ "{{consumergroup}}" }} / {{ "{{topic}}" }}","refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"}},
        {"id":6,"type":"state-timeline","title":"Monitoring Targets","gridPos":{"h":8,"w":12,"x":12,"y":16},"targets":[{"expr":"up{job=~\"soc-.*|kafka-exporter\"}","legendFormat":"{{ "{{job}}" }}","range":true,"refId":"A"}],"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"0":{"color":"red","index":0,"text":"Down"},"1":{"color":"green","index":1,"text":"Up"}}}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]},"options":{"legend":{"displayMode":"hidden","placement":"bottom"},"mergeValues":true,"rowHeight":0.9,"showValue":"never","tooltip":{"mode":"single","sort":"none"}},"pluginVersion":"13.1.0"}
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": ["soc", "entity-management"],
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "SOC Entity Management",
      "uid": "soc-entity-management",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soc.grafanaName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.monitoring.grafana.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soc.grafanaName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "soc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/lib/grafana && chown -R 472:472 /var/lib/grafana"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image | quote }}
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soc.secretName" . }}
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED
              value: "false"
            - name: GF_PLUGINS_PLUGIN_ADMIN_EXTERNAL_MANAGE_ENABLED
              value: "false"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
      volumes:
        - name: datasource
          configMap:
            name: {{ include "soc.grafanaName" . }}-datasources
        - name: dashboard-provider
          configMap:
            name: {{ include "soc.grafanaName" . }}-dashboard-provider
        - name: dashboard
          configMap:
            name: {{ include "soc.grafanaName" . }}-dashboard
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "soc.grafanaName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soc.grafanaName" . }}
  labels:
    {{- include "soc.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.monitoring.grafana.port }}
      targetPort: http
  selector:
    {{- include "soc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
