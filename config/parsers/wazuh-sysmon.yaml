id: wazuh-sysmon
display_name: Wazuh Sysmon
description: Microsoft-Windows-Sysmon records wrapped by Wazuh archives.
category: siem
enabled: true
public: false
priority: 90
match:
  all:
    - equals:
        path: decoder.name
        value: windows_eventchannel
    - equals:
        path: data.win.system.providerName
        value: Microsoft-Windows-Sysmon
    - in:
        path: data.win.system.eventID
        values: [1, 3, 10, 11, 22]
ocsf:
  event_id:
    hash_paths: [id, timestamp, data.win.system.eventRecordID, data.win.system.eventID, data.win.eventdata.utcTime]
  time:
    first:
      - path: data.win.eventdata.utcTime
        transforms: [normalize_empty]
      - path: data.win.system.systemTime
        transforms: [normalize_empty]
      - path: timestamp
  tenant_id:
    path: tenant_id
    transforms: [normalize_empty]
  source_name:
    value: wazuh_sysmon
  event_type:
    path: data.win.system.eventID
    transforms: [sysmon_event_type]
  class_uid:
    path: data.win.system.eventID
    transforms: [sysmon_class_uid]
  class_name:
    path: data.win.system.eventID
    transforms: [sysmon_class_name]
  category_uid:
    path: data.win.system.eventID
    transforms: [sysmon_category_uid]
  category_name:
    path: data.win.system.eventID
    transforms: [sysmon_category_name]
  activity_id:
    path: data.win.system.eventID
    transforms: [sysmon_activity_id]
  activity_name:
    path: data.win.system.eventID
    transforms: [sysmon_activity_name]
  severity_id:
    value: 1
  fields:
    actor.user.name:
      first:
        - path: data.win.eventdata.user
          transforms: [normalize_empty]
        - path: data.win.eventdata.sourceUser
          transforms: [normalize_empty]
    device.hostname:
      first:
        - path: data.win.system.computer
          transforms: [normalize_empty]
        - path: agent.name
          transforms: [normalize_empty]
    process.name:
      first:
        - path: data.win.eventdata.image
          transforms: [process_name]
        - path: data.win.eventdata.sourceImage
          transforms: [process_name]
    process.cmd_line:
      path: data.win.eventdata.commandLine
      transforms: [normalize_empty]
    process.file.path:
      first:
        - path: data.win.eventdata.image
          transforms: [normalize_empty]
        - path: data.win.eventdata.sourceImage
          transforms: [normalize_empty]
    process.file.name:
      first:
        - path: data.win.eventdata.image
          transforms: [process_name]
        - path: data.win.eventdata.sourceImage
          transforms: [process_name]
    process.file.hashes:
      path: data.win.eventdata.hashes
      transforms: [sha256_hashes]
    file.path:
      first:
        - path: data.win.eventdata.targetFilename
          transforms: [normalize_empty]
        - path: data.win.eventdata.targetImage
          transforms: [normalize_empty]
    file.name:
      first:
        - path: data.win.eventdata.targetFilename
          transforms: [process_name]
        - path: data.win.eventdata.targetImage
          transforms: [process_name]
    file.hashes:
      path: data.win.eventdata.hashes
      transforms: [sha256_hashes]
    src_endpoint.ip:
      first:
        - path: data.win.eventdata.sourceIp
          transforms: [normalize_empty]
        - path: data.win.eventdata.srcIp
          transforms: [normalize_empty]
    dst_endpoint.ip:
      first:
        - path: data.win.eventdata.destinationIp
          transforms: [normalize_empty]
        - path: data.win.eventdata.destIp
          transforms: [normalize_empty]
        - path: data.win.eventdata.queryResults
          transforms: [first_ip]
    query.hostname:
      path: data.win.eventdata.queryName
      transforms: [normalize_domain]
  unmapped:
    windows_event_id:
      path: data.win.system.eventID
      transforms: [string]
    provider_name:
      path: data.win.system.providerName
    channel:
      path: data.win.system.channel
    event_record_id:
      path: data.win.system.eventRecordID
    decoder:
      path: decoder.name
    target_process_id:
      path: data.win.eventdata.targetProcessId
    source_process_id:
      path: data.win.eventdata.sourceProcessId
