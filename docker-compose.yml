services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: ${DOCKER_VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      NEO4J_URI: ${DOCKER_NEO4J_URI}
      NEO4J_USER: ${DOCKER_NEO4J_USER}
      NEO4J_PASSWORD: ${DOCKER_NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      PARSER_CONFIG_DIR: /app/config/parsers
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./config:/app/config:ro
      - ./data:/data:ro
      - ./wazuh-archives.jsonl:/wazuh-archives.jsonl:ro
    depends_on:
      postgresql:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully

  kafka-ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.kafka_ingestion_worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      NEO4J_URI: ${DOCKER_NEO4J_URI}
      NEO4J_USER: ${DOCKER_NEO4J_USER}
      NEO4J_PASSWORD: ${DOCKER_NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      PARSER_CONFIG_DIR: /app/config/parsers
    volumes:
      - ./backend/app:/app/app
      - ./config:/app/config:ro
      - ./data:/data:ro
      - ./wazuh-archives.jsonl:/wazuh-archives.jsonl:ro
    depends_on:
      postgresql:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully

  kafka-graph-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.kafka_graph_worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      REDIS_URL: ${DOCKER_REDIS_URL}
      NEO4J_URI: ${DOCKER_NEO4J_URI}
      NEO4J_USER: ${DOCKER_NEO4J_USER}
      NEO4J_PASSWORD: ${DOCKER_NEO4J_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
    volumes:
      - ./backend/app:/app/app
      - ./data:/data:ro
      - ./wazuh-archives.jsonl:/wazuh-archives.jsonl:ro
    depends_on:
      postgresql:
        condition: service_started
      neo4j:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully

  postgresql:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:3.9.1
    user: "0:0"
    env_file:
      - .env
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
    volumes:
      - kafka_data:/tmp/kafka-logs

  kafka-init-topics:
    image: apache/kafka:3.9.1
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -ec
      - |
        for attempt in {1..30}; do
          if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic "$$KAFKA_RAW_EVENTS_TOPIC" --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic "$$KAFKA_NORMALIZED_EVENTS_TOPIC" --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic "$$KAFKA_OCSF_EVENTS_TOPIC" --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic "$$KAFKA_DEAD_LETTER_TOPIC" --partitions 3 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    env_file:
      - .env
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-18080}:8080"
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
      kafka-ingestion-worker:
        condition: service_started
      kafka-graph-worker:
        condition: service_started
      kafka-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_EXTERNAL_MANAGE_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
  kafka_data:
  prometheus_data:
  grafana_data:
