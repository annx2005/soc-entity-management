global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: soc-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: soc-kafka-ingestion-worker
    static_configs:
      - targets:
          - kafka-ingestion-worker:9100

  - job_name: soc-kafka-graph-worker
    static_configs:
      - targets:
          - kafka-graph-worker:9100

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
